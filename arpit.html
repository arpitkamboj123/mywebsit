<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>/* Universal styles */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    line-height: 1.6;
    margin: 0;
    padding: 0;
    background-color: #f4f7f6;
    color: #333;
}

/* Header section styling */
header {
    background-color: #2c3e50;
    color: white;
    text-align: center;
    padding: 2rem 1rem;
}

/* Main content wrapper */
main {
    max-width: 800px;
    margin: 2rem auto;
    padding: 0 1rem;
}

/* Styling links into buttons */
a {
    display: inline-block;
    background-color: #3498db;
    color: white;
    padding: 10px 20px;
    text-decoration: none;
    border-radius: 5px;
    margin-top: 15px;
}

a:hover {
    background-color: #2980b9;
}

/* Footer layout */
footer {
    text-align: center;
    padding: 1rem;
    background-color: #ddd;
    position: fixed;
    bottom: 0;
    width: 100%;
}
</style>
</head>
<body>
    <header>
        <h1>Welcome to My Website</h1>
        <p>Built completely from scratch using code!</p>
    </header>

    <main>
        <section>
            <h2>About Me</h2>
            <p>This is a simple paragraph describing who I am and what I love to do.</p>
            <a href="https://snapchat.com/t/HDZhgStI" target="_blank">Visit My Snapchat Profile</a>
        </section>
    </main>

    <footer>
        <p>© 2026 My Web Page. All rights reserved.</p>
    </footer>
</body>
</html>
